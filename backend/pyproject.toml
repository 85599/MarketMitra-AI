[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E731",  # lambda assignments are used deliberately in payoff builders
    "B008",  # FastAPI Query()/Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
